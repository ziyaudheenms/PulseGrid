services:

  mongodb:
    image: mongo:7.0
    container_name: pulsegrid-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pulsegrid-network


  datapipeline:
    build:
      context: .
      dockerfile: services/datapipeline/Dockerfile
    container_name: pulsegrid-datapipeline
    restart: unless-stopped
    ports:
      - "8001:8000"  # Host 8001 -> Container 8000
    env_file:
      - services/datapipeline/.env
    depends_on:
      - mongodb
    networks:
      - pulsegrid-network

 
  datapipeline-worker:
    build:
      context: .
      dockerfile: services/datapipeline/Dockerfile
    container_name: pulsegrid-datapipeline-worker
    restart: always
    environment:
      - PYTHONPATH=/app/app
    command: /app/.venv/bin/python -m app.workers.data_pipeline_worker
    env_file:
      - services/datapipeline/.env
    depends_on:
      - mongodb
    networks:
      - pulsegrid-network

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: pulsegrid-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"  # Host 8000 -> Container 8000
    env_file:
      - services/gateway/.env
    depends_on:
      - datapipeline
    networks:
      - pulsegrid-network

volumes:
  mongodb_data:

networks:
  pulsegrid-network:
    driver: bridge