worker_processes  1;
events { worker_connections 1024; }

# Expose the environment variable to Nginx/Lua workers
env GATEWAY_PUBLIC_KEY_B64;

http {
    server {
        listen 80;
        server_name datapipeline-proxy;

        location / {
            access_by_lua_block {
                local ffi = require("ffi")

                -- Bind Libsodium's cryptographic verification function via FFI
                ffi.cdef[[
                    int crypto_sign_verify_detached(
                        const unsigned char *sig,
                        const unsigned char *m,
                        unsigned long long mlen,
                        const unsigned char *pk
                    );
                ]]

                local libsodium = ffi.load("libsodium")

                local sig_hex = ngx.req.get_headers()["X-Signature"]
                local timestamp = ngx.req.get_headers()["X-Timestamp"]
                local nonce = ngx.req.get_headers()["X-Nonce"]

                # 1. Fail fast if security headers are missing (Lua comment inside block uses --)
                -- 1. Fail fast if security headers are missing
                if not sig_hex or not timestamp or not nonce then
                    ngx.log(ngx.ERR, "Missing security headers!")
                    ngx.exit(ngx.HTTP_FORBIDDEN)
                end

                -- 2. Validate timestamp freshness window (within 5 seconds)
                local current_time = ngx.now()
                local req_time = tonumber(timestamp)
                if not req_time or math.abs(current_time - req_time) > 5 then
                    ngx.log(ngx.ERR, "Request expired or timestamp tampered!")
                    ngx.exit(ngx.HTTP_UNAUTHORIZED)
                end

                -- 3. Reconstruct exact canonical message: METHOD|PATH|TIMESTAMP|NONCE
                local method = ngx.req.get_method()
                local path = ngx.var.uri
                local message = method .. "|" .. path .. "|" .. timestamp .. "|" .. nonce

                -- 4. Load Base64 Public Key from container environment variables
                local pubkey_b64 = os.getenv("GATEWAY_PUBLIC_KEY_B64")
                if not pubkey_b64 then
                    ngx.log(ngx.ERR, "GATEWAY_PUBLIC_KEY_B64 environment variable is not set!")
                    ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
                end

                local function hex_to_bin(hex)
                    return (hex:gsub('..', function (cc)
                        return string.char(tonumber(cc, 16))
                    end))
                end

                local sig_bin = hex_to_bin(sig_hex)
                local pk_bin = ngx.decode_base64(pubkey_b64)

                if #sig_bin ~= 64 or not pk_bin or #pk_bin ~= 32 then
                    ngx.log(ngx.ERR, "Invalid signature or public key length/decoding!")
                    ngx.exit(ngx.HTTP_FORBIDDEN)
                end

                -- 5. Execute Libsodium signature verification
                local rc = libsodium.crypto_sign_verify_detached(
                    sig_bin,
                    message,
                    #message,
                    pk_bin
                )

                if rc ~= 0 then
                    ngx.log(ngx.ERR, "Libsodium signature verification failed!")
                    ngx.exit(ngx.HTTP_FORBIDDEN)
                end
            }

            # 6. Forward validated request to internal FastAPI service (port 8000)
            # By omitting a trailing slash in proxy_pass, Nginx automatically preserves 
            # and forwards the exact original request URI and query parameters.
            proxy_pass http://127.0.0.1:8000;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}