# Load OpenResty's Lua environment
worker_processes  1;
events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name datapipeline-proxy;

        location / {
            # --- ACCESS PHASE: The Security Gatekeeper ---
            access_by_lua_block {
                -- 1. Grab the security headers sent by the Gateway
                local sig = ngx.req.get_headers()["X-Signature"]
                local timestamp = ngx.req.get_headers()["X-Timestamp"]
                local nonce = ngx.req.get_headers()["X-Nonce"]

                -- 2. Check if headers exist (Fail fast if missing)
                if not sig or not timestamp or not nonce then
                    ngx.log(ngx.ERR, "Security headers missing!")
                    ngx.exit(ngx.HTTP_FORBIDDEN) -- Drops connection immediately (403)
                end

                -- 3. Anti-Replay Protection: Check if timestamp is older than 5 seconds
                local current_time = ngx.now()
                local req_time = tonumber(timestamp)
                if not req_time or math.abs(current_time - req_time) > 5 then
                    ngx.log(ngx.ERR, "Request expired or timestamp tampered!")
                    ngx.exit(ngx.HTTP_UNAUTHORIZED) -- 401 Unauthorized
                end

                -- 4. Cryptographic Verification (Using Libsodium / Public Key)
                -- In a full implementation, Lua's FFI calls libsodium here 
                -- to verify that 'sig' matches the request body using the Gateway's Public Key.
                local is_valid = true -- Simulated verification result
                
                if not is_valid then
                    ngx.log(ngx.ERR, "Cryptographic signature verification failed!")
                    ngx.exit(ngx.HTTP_FORBIDDEN)
                end
            }

            # --- PROXY PASS: If checks pass, send clean request to Python app ---
            proxy_pass http://127.0.0.1:8000;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}